# CPU smoke test of Raslila v4 (cortex) (use --synthetic): seconds, proves the pipeline runs.
model:
  family: raslila
  arch: cortex
  vocab_size: 512
  d_model: 64
  n_heads: 2
  n_prelude: 1
  n_core: 2
  n_coda: 1
  cube_shape: [4, 4, 4]
  mean_loops: 3
  max_train_loops: 6
  backprop_loops: 2
  test_loops: 4
  eval_loops: [1, 2, 4]
  topo_weight: 0.1
train:
  tokens: 2.0e5
  seq_len: 64
  batch_tokens: 2048
  micro_batch: 8
  lr: 1.0e-3
  eval_every: 10
  eval_batches: 2
  log_every: 5
  save_every_minutes: 1
data: configs/data.yaml
out_dir: runs/smoke_cortex
