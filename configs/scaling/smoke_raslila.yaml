# CPU smoke test (use --synthetic): seconds, proves the pipeline runs.
model:
  family: raslila
  vocab_size: 512
  grid_shape: [2, 2, 2]
  d_node: 64
  n_heads: 2
  node_depth: 1
  d_embed: 64
  max_think_cycles: 2
train:
  tokens: 2.0e5
  seq_len: 64
  batch_tokens: 2048
  micro_batch: 8
  lr: 1.0e-3
  eval_every: 10
  eval_batches: 2
  log_every: 5
  save_every_minutes: 1
data: configs/data.yaml
out_dir: runs/smoke_raslila
