# Scaling study, tier 50m: RASLILA v4 (the 150m recipe, scaled down).
# Pair: configs/scaling/baseline_50m.yaml -- same params (~42M), data, tokens, lr, batch.
# (The v2/v3 grid config this replaced is in git history; its runs are in runs/v3/.)
model:
  family: raslila
  arch: cortex
  vocab_size: 32768
  d_model: 512
  n_heads: 8
  n_prelude: 2
  n_core: 4               # looped: effective depth 2 + 4 x loops + 2 (baseline_50m: 8 layers)
  n_coda: 2
  cube_shape: [8, 8, 8]
  mean_loops: 4           # random loop count per step (log-normal Poisson, Huginn)
  max_train_loops: 16
  backprop_loops: 4       # gradients through the last 4 loops only
  test_loops: 8           # headline number is read out after 8 loops
  eval_loops: [1, 2, 4, 8, 16]
  topo_weight: 0.0        # 3D brain-region loss: off here, its own experiment (raslila_150m_topo)
  activation_checkpoint: false
train:
  tokens: 1.0e9
  seq_len: 1024
  batch_tokens: 524288
  micro_batch: 32         # per GPU; lower it on OOM (accumulation keeps batch_tokens fixed)
  lr: 8.0e-4
  min_lr_frac: 0.1
  weight_decay: 0.1
  grad_clip: 1.0
  eval_every: 250
  eval_batches: 40
  log_every: 10
  save_every_minutes: 30
  seed: 1234
data: configs/data.yaml
out_dir: runs/raslila_50m
