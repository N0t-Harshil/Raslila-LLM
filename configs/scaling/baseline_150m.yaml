# Scaling study, tier 150m: STANDARD TRANSFORMER baseline (the yardstick).
# Pair: configs/scaling/raslila_150m.yaml -- same parameters (160M vs 162M),
# data, tokens, lr, batch. Raslila v4 spends ~2.2x the training compute per
# token by looping its core; that is reported, not hidden.
model:
  family: baseline
  vocab_size: 32768
  d_model: 1024
  n_layers: 10
  n_heads: 16
  activation_checkpoint: false
train:
  tokens: 3.2e9           # SAME token budget for both families (~20 tokens/param)
  seq_len: 1024
  batch_tokens: 524288    # 0.5M tokens per optimizer step
  micro_batch: 32         # per GPU; lower it on OOM (accumulation keeps batch_tokens fixed)
  lr: 5.0e-4
  min_lr_frac: 0.1
  weight_decay: 0.1
  grad_clip: 1.0
  eval_every: 250
  eval_batches: 40
  log_every: 10
  save_every_minutes: 30
  seed: 1234
data: configs/data.yaml
out_dir: runs/baseline_150m
