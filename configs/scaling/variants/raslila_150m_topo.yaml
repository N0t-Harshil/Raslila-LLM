# Variant of configs/scaling/raslila_150m.yaml with the 3D spatial-smoothness
# ("brain regions") loss switched on. Compare with raslila_150m to measure its cost.
model:
  family: raslila
  arch: cortex
  vocab_size: 32768
  d_model: 1024
  n_heads: 16
  n_prelude: 2
  n_core: 6               # looped: effective depth 2 + 6 x loops + 2
  n_coda: 2
  cube_shape: [8, 8, 16]
  mean_loops: 4           # random loop count per step (log-normal Poisson, Huginn)
  max_train_loops: 16
  backprop_loops: 4       # gradients through the last 4 loops only
  test_loops: 8           # headline number is read out after 8 loops
  eval_loops: [1, 2, 4, 8, 16]
  topo_weight: 0.5          # 3D brain-region loss ON (TopoLM used 2.5 and paid +0.11 val loss)
  activation_checkpoint: false
train:
  tokens: 3.2e9
  seq_len: 1024
  batch_tokens: 524288
  micro_batch: 16         # per GPU; lower it on OOM (accumulation keeps batch_tokens fixed)
  lr: 5.0e-4
  min_lr_frac: 0.1
  weight_decay: 0.1
  grad_clip: 1.0
  eval_every: 250
  eval_batches: 40
  log_every: 10
  save_every_minutes: 30
  seed: 1234
data: configs/data.yaml
out_dir: runs/raslila_150m_topo
