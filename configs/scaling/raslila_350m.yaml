# Scaling study, tier 350m: RASLILA v2 (3D grid, thinking loops).
# Pair: configs/scaling/baseline_350m.yaml (same data, tokens, lr, batch).
# Training samples 1 or 2 thinking cycles per step (1 cycle = one bottom-up
# sweep, 2 = up, down through feedback, up again) and supervises both exits;
# eval reports the loss after each cycle. Compute is measured, not assumed.
model:
  family: raslila
  vocab_size: 32768
  grid_shape: [5, 4, 4]
  d_node: 384
  n_heads: 6
  node_depth: 2
  d_embed: 1024
  max_think_cycles: 2
  routing: true          # v3: per token, each block picks which neighbours to listen to
  msg_rank: 0            # routed channel width; 0 = d_node/4 (cheap connections)
  depth_sweeps: 2
  lateral: true
  feedback: true
  long_range_prob: 0.1
  max_long_range: 3
  connectivity_seed: 42
  activation_checkpoint: false   # measured 1.28x faster on A100 (fits at this micro_batch); same results
train:
  tokens: 7.0e9           # SAME token budget for both families in this tier (~20 tokens/param)
  seq_len: 1024
  batch_tokens: 524288    # 0.5M tokens per optimizer step (GPT-3 recipe)
  micro_batch: 4      # per GPU; lower it on OOM (accumulation keeps batch_tokens fixed)
  lr: 3.0e-4
  min_lr_frac: 0.1
  weight_decay: 0.1
  grad_clip: 1.0
  eval_every: 250
  eval_batches: 40
  log_every: 10
  save_every_minutes: 30
  seed: 1234
data: configs/data.yaml
out_dir: runs/raslila_350m
